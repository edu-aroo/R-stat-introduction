<text class="en" x="460" y="24" text-anchor="middle" font-size="14" fill="#5d6b75">Decide the question, the design and the analysis BEFORE collecting the data</text>
<text class="fr" x="460" y="24" text-anchor="middle" font-size="14" fill="#5d6b75">Décidez la question, le plan et l'analyse AVANT de collecter les données</text>
