<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" role="img" aria-label="Anatomy of a boxplot" font-family="Source Sans 3, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="arb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6b75"/></marker></defs>
<!-- axis -->
<line x1="40" y1="190" x2="820" y2="190" stroke="#8a969e"/>
<!-- whiskers -->
<line x1="120" y1="110" x2="300" y2="110" stroke="#0b3d5c" stroke-width="2.5"/>
<line x1="470" y1="110" x2="640" y2="110" stroke="#0b3d5c" stroke-width="2.5"/>
<line x1="120" y1="95" x2="120" y2="125" stroke="#0b3d5c" stroke-width="2.5"/>
<line x1="640" y1="95" x2="640" y2="125" stroke="#0b3d5c" stroke-width="2.5"/>
<!-- box -->
<rect x="300" y="75" width="170" height="70" fill="#e9f4f6" stroke="#0b3d5c" stroke-width="2.5"/>
<line x1="370" y1="75" x2="370" y2="145" stroke="#d9694a" stroke-width="4"/>
<!-- outliers -->
<circle cx="740" cy="110" r="7" fill="none" stroke="#0b3d5c" stroke-width="2.5"/>
<circle cx="785" cy="110" r="7" fill="none" stroke="#0b3d5c" stroke-width="2.5"/>
<!-- labels top -->
<g font-size="15" fill="#0b3d5c" text-anchor="middle">
<text class="en" x="300" y="62">Q1 (25 %)</text><text class="fr" x="300" y="62">Q1 (25 %)</text>
<text class="en" x="370" y="40" fill="#d9694a" font-weight="700">median</text><text class="fr" x="370" y="40" fill="#d9694a" font-weight="700">médiane</text>
<text class="en" x="470" y="62">Q3 (75 %)</text><text class="fr" x="470" y="62">Q3 (75 %)</text>
<text class="en" x="120" y="82">lowest value within 1.5 × IQR</text><text class="fr" x="120" y="82">plus petite valeur à moins de 1,5 × IQR</text>
<text class="en" x="640" y="82">highest value within 1.5 × IQR</text><text class="fr" x="640" y="82">plus grande valeur à moins de 1,5 × IQR</text>
<text class="en" x="762" y="146">outliers</text><text class="fr" x="762" y="146">valeurs extrêmes</text>
</g>
<!-- IQR brace -->
<line x1="300" y1="165" x2="470" y2="165" stroke="#5d6b75" stroke-width="1.5" marker-start="url(#arb)" marker-end="url(#arb)"/>
<text class="en" x="385" y="182" text-anchor="middle" font-size="14" fill="#5d6b75">IQR = Q3 − Q1: the middle 50 %</text>
<text class="fr" x="385" y="182" text-anchor="middle" font-size="14" fill="#5d6b75">IQR = Q3 − Q1 : les 50 % centraux</text>
<line x1="470" y1="210" x2="725" y2="210" stroke="#d9694a" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arb)" marker-end="url(#arb)"/>
<text class="en" x="598" y="226" text-anchor="middle" font-size="13" fill="#d9694a">limit: Q3 + 1.5 × IQR</text>
<text class="fr" x="598" y="226" text-anchor="middle" font-size="13" fill="#d9694a">limite : Q3 + 1,5 × IQR</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
