<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Type I and type II errors" font-family="Source Sans 3, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<g font-size="15" text-anchor="middle">
<text class="en" x="470" y="22" font-weight="700" fill="#0b3d5c">The truth (unknown)</text><text class="fr" x="470" y="22" font-weight="700" fill="#0b3d5c">La réalité (inconnue)</text>
<rect x="250" y="34" width="220" height="40" fill="#0b3d5c"/><rect x="470" y="34" width="220" height="40" fill="#1b7f8c"/>
<text class="en" x="360" y="60" fill="#fff" font-weight="700">H0 true (no effect)</text><text class="fr" x="360" y="60" fill="#fff" font-weight="700">H0 vraie (pas d'effet)</text>
<text class="en" x="580" y="60" fill="#fff" font-weight="700">H0 false (real effect)</text><text class="fr" x="580" y="60" fill="#fff" font-weight="700">H0 fausse (effet réel)</text>
<rect x="30" y="74" width="220" height="80" fill="#f6f1e7" stroke="#fff"/><rect x="30" y="154" width="220" height="80" fill="#f6f1e7" stroke="#fff"/>
<text class="en" x="140" y="110" font-weight="700" fill="#0b3d5c">Test: reject H0</text><text class="fr" x="140" y="110" font-weight="700" fill="#0b3d5c">Test : rejeter H0</text>
<text class="en" x="140" y="130" fill="#5d6b75" font-size="13">p &lt; α, "significant"</text><text class="fr" x="140" y="130" fill="#5d6b75" font-size="13">p &lt; α, « significatif »</text>
<text class="en" x="140" y="190" font-weight="700" fill="#0b3d5c">Test: do not reject H0</text><text class="fr" x="140" y="190" font-weight="700" fill="#0b3d5c">Test : ne pas rejeter H0</text>
<text class="en" x="140" y="210" fill="#5d6b75" font-size="13">p ≥ α</text><text class="fr" x="140" y="210" fill="#5d6b75" font-size="13">p ≥ α</text>
<rect x="250" y="74" width="220" height="80" fill="#fdf0eb" stroke="#d9694a" stroke-width="2"/>
<text class="en" x="360" y="108" font-weight="700" fill="#d9694a">Type I error</text><text class="fr" x="360" y="108" font-weight="700" fill="#d9694a">Erreur de type I</text>
<text class="en" x="360" y="130" fill="#3c4a52" font-size="13">false positive · probability α</text><text class="fr" x="360" y="130" fill="#3c4a52" font-size="13">faux positif · probabilité α</text>
<rect x="470" y="74" width="220" height="80" fill="#eef5ea" stroke="#4a7d3a" stroke-width="2"/>
<text class="en" x="580" y="108" font-weight="700" fill="#4a7d3a">Correct: detection</text><text class="fr" x="580" y="108" font-weight="700" fill="#4a7d3a">Correct : détection</text>
<text class="en" x="580" y="130" fill="#3c4a52" font-size="13">power = 1 − β</text><text class="fr" x="580" y="130" fill="#3c4a52" font-size="13">puissance = 1 − β</text>
<rect x="250" y="154" width="220" height="80" fill="#eef5ea" stroke="#4a7d3a" stroke-width="2"/>
<text class="en" x="360" y="188" font-weight="700" fill="#4a7d3a">Correct</text><text class="fr" x="360" y="188" font-weight="700" fill="#4a7d3a">Correct</text>
<text class="en" x="360" y="210" fill="#3c4a52" font-size="13">probability 1 − α</text><text class="fr" x="360" y="210" fill="#3c4a52" font-size="13">probabilité 1 − α</text>
<rect x="470" y="154" width="220" height="80" fill="#fdf0eb" stroke="#d9694a" stroke-width="2"/>
<text class="en" x="580" y="188" font-weight="700" fill="#d9694a">Type II error</text><text class="fr" x="580" y="188" font-weight="700" fill="#d9694a">Erreur de type II</text>
<text class="en" x="580" y="210" fill="#3c4a52" font-size="13">false negative · probability β</text><text class="fr" x="580" y="210" fill="#3c4a52" font-size="13">faux négatif · probabilité β</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
